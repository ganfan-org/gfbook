[package]
name = "gfbook"
version = "0.2.0"
description = "gfbook - a local knowledge base app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
# Dev-mode Dock name comes from the binary file name; a bundle app (from
# `tauri build`) uses productName ("Ganfan Book") instead. No spaces allowed
# here because the bin name doubles as the Rust crate name.
name = "GanfanBook"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gfbook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
# vendored-openssl: statically link OpenSSL so release builds don't depend on
# Homebrew's /opt/homebrew/opt/openssl@3 dylibs (which other Macs don't have,
# and which hardened-runtime library validation would reject anyway).
git2 = { version = "0.19", features = ["vendored-libgit2", "vendored-openssl"] }
reqwest = { version = "0.12", features = ["blocking"] }
url = "2"
chrono = { version = "0.4", features = ["serde"] }

